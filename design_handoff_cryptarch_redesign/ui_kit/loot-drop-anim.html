<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cryptarch · Loot Drop Animation</title>
  <link rel="stylesheet" href="../../colors_and_type.css">
  <style>
    @keyframes sacredDrift { from { background-position: 0 0; } to { background-position: 600px 600px; } }
    @keyframes shimmer { 0% { left: -100%; } 50% { left: 200%; } 100% { left: 200%; } }

    /* ── Loot drop keyframes ── */
    @keyframes dropSlideIn {
      0%   { transform: translateX(-120%); opacity: 0; }
      15%  { transform: translateX(0); opacity: 1; }
      20%  { transform: translateX(0); opacity: 1; }
      /* Brief bright flash at the moment it fully lands */
      22%  { filter: brightness(1.6); }
      30%  { filter: brightness(1); }
      /* Hold visible */
      85%  { transform: translateX(0); opacity: 1; }
      100% { transform: translateX(0); opacity: 1; }
    }

    @keyframes dropFlash {
      0%   { opacity: 0; }
      15%  { opacity: 0; }
      20%  { opacity: 0.7; }
      35%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes dropSweep {
      0%   { left: -50%; }
      15%  { left: -50%; }
      20%  { left: -20%; }
      50%  { left: 120%; }
      100% { left: 120%; }
    }

    @keyframes engram-pulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50%      { transform: scale(1.15); opacity: 1; }
    }

    @keyframes engram-decrypt {
      0%   { transform: scale(1) rotate(0deg); opacity: 1; filter: brightness(1); }
      40%  { transform: scale(1.2) rotate(180deg); opacity: 1; filter: brightness(2); }
      60%  { transform: scale(0.3) rotate(360deg); opacity: 0.5; filter: brightness(3); }
      100% { transform: scale(0) rotate(540deg); opacity: 0; filter: brightness(1); }
    }

    @keyframes particles-burst {
      0%   { transform: scale(0); opacity: 1; }
      50%  { transform: scale(1.5); opacity: 0.6; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    body { background: #0c0e11; margin: 0; padding: 40px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
  </style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel">

/* ─── Drop notification that animates in like D2's "item acquired" ─── */
function DropNotification({ drop, index, onComplete }) {
  const [phase, setPhase] = useState('waiting'); // waiting | engram | decrypt | banner | done
  const isExotic = drop.isExotic;
  const isLegendary = !isExotic && drop.type === 'weapon';
  const rarityColor = isExotic ? C.exotic : isLegendary ? C.legendaryBright : C.keep;
  const rarityDim = isExotic ? C.exoticDim : isLegendary ? C.legendaryDim : C.keepDim;
  const rarityGlow = isExotic ? 'rgba(212,175,55,0.6)' : isLegendary ? 'rgba(157,113,199,0.5)' : 'rgba(90,158,111,0.4)';

  useEffect(() => {
    const delay = index * 1200; // stagger each drop by 1.2s
    const t1 = setTimeout(() => setPhase('engram'), delay);
    const t2 = setTimeout(() => setPhase('decrypt'), delay + 400);
    const t3 = setTimeout(() => setPhase('banner'), delay + 700);
    const t4 = setTimeout(() => { setPhase('done'); onComplete?.(); }, delay + 1800);
    return () => { clearTimeout(t1); clearTimeout(t2); clearTimeout(t3); clearTimeout(t4); };
  }, [index]);

  if (phase === 'waiting') return null;

  return (
    <div style={{
      position: 'relative', height: 52, marginBottom: 4,
      overflow: 'hidden',
    }}>
      {/* Engram phase: pulsing rarity-colored diamond */}
      {(phase === 'engram' || phase === 'decrypt') && (
        <div style={{
          position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)',
          zIndex: 3,
        }}>
          <div style={{
            width: 24, height: 24, 
            background: rarityColor,
            clipPath: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)',
            boxShadow: `0 0 20px ${rarityGlow}`,
            animation: phase === 'decrypt' 
              ? 'engram-decrypt 0.4s ease-in forwards'
              : 'engram-pulse 0.5s ease-in-out infinite',
          }} />
        </div>
      )}

      {/* Particle burst on decrypt */}
      {phase === 'decrypt' && (
        <div style={{
          position: 'absolute', left: 16, top: '50%', transform: 'translateY(-50%)',
          zIndex: 2,
        }}>
          {[...Array(8)].map((_, i) => (
            <div key={i} style={{
              position: 'absolute',
              width: 3, height: 3,
              background: rarityColor,
              borderRadius: '50%',
              left: 10, top: 10,
              opacity: 0,
              animation: `particles-burst 0.5s ${i * 0.03}s ease-out forwards`,
              transform: `rotate(${i * 45}deg) translateX(${8 + i * 3}px)`,
            }} />
          ))}
        </div>
      )}

      {/* Banner phase: the actual item-acquired card slides in from left */}
      {(phase === 'banner' || phase === 'done') && (
        <div style={{
          position: 'absolute', inset: 0,
          animation: 'dropSlideIn 1.1s ease-out forwards',
        }}>
          {/* Flash overlay */}
          <div style={{
            position: 'absolute', inset: 0, zIndex: 2,
            background: `linear-gradient(90deg, ${rarityColor}, transparent)`,
            animation: 'dropFlash 1.1s ease-out forwards',
            pointerEvents: 'none',
          }} />

          {/* Light sweep */}
          <div style={{
            position: 'absolute', top: 0, width: '40%', height: '100%', zIndex: 2,
            background: `linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent)`,
            animation: 'dropSweep 1.1s ease-out forwards',
            pointerEvents: 'none',
          }} />

          {/* The actual card content */}
          <div style={{
            display: 'flex', alignItems: 'center', gap: 10, padding: '6px 12px',
            height: '100%', boxSizing: 'border-box',
            background: C.bgPanel,
            borderLeft: `3px solid ${rarityColor}`,
            backgroundImage: `linear-gradient(90deg, ${rarityDim} 0%, transparent 50%)`,
            position: 'relative', zIndex: 1,
          }}>
            <WeaponIcon drop={drop} size={38} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{
                fontSize: 11, color: rarityColor,
                ...S.med, ...S.upper,
                overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
              }}>{drop.name}</div>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 6, marginTop: 2,
              }}>
                <ElementPip sub={drop.sub} />
                <span style={{ fontSize: 9, color: C.textMuted, ...S.upper }}>{drop.sub}</span>
              </div>
            </div>
            {drop.perks?.length > 0 && (
              <div style={{ display: 'flex', gap: 2 }}>
                {drop.perks.slice(0, 4).map((p, i) => <PerkIcon key={i} perk={p} size={18} />)}
              </div>
            )}
            <GradeBadge grade={drop.grade} />
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── Demo harness: simulates drops arriving from the API ─── */
function LootDropDemo() {
  const [drops, setDrops] = useState([]);
  const [running, setRunning] = useState(false);

  const allDrops = SAMPLE_DROPS.filter(d => d.grade === 'god' || d.grade === 'exotic' || d.grade === 'keep');

  const startDemo = () => {
    setDrops([]);
    setRunning(true);
    // Queue all drops
    setTimeout(() => setDrops([...allDrops]), 100);
  };

  const resetDemo = () => {
    setDrops([]);
    setRunning(false);
  };

  return (
    <div style={{
      width: 420, background: C.bgDeep, color: C.text,
      fontFamily: 'inherit', fontSize: 13,
      border: `1px solid ${C.hairline}`,
      position: 'relative', overflow: 'hidden',
    }}>
      <SacredBG opacity={0.7} />

      {/* Header */}
      <div style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        padding: '14px 16px', borderBottom: `1px solid ${C.hairline}`,
        position: 'relative', zIndex: 1,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <img src="../../assets/icon-48.png" alt="" width="20" height="20"
            style={{ border: `1px solid ${C.goldLine}` }} />
          <span style={{ fontSize: 13, ...S.light, ...S.upperH }}>Loot Drop Animation</span>
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {!running ? (
            <BracketBtn onClick={startDemo} small>Simulate Drops</BracketBtn>
          ) : (
            <Btn onClick={resetDemo} small>Reset</Btn>
          )}
        </div>
      </div>

      {/* Drop feed area */}
      <div style={{
        minHeight: 400, padding: '12px',
        position: 'relative', zIndex: 1,
      }}>
        {!running && drops.length === 0 && (
          <div style={{
            textAlign: 'center', padding: '80px 20px',
            color: C.textMuted, fontSize: 11, ...S.upper,
          }}>
            <div style={{ marginBottom: 12 }}>
              <div style={{
                width: 32, height: 32, margin: '0 auto 16px',
                background: C.legendaryBright,
                clipPath: 'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)',
                opacity: 0.4,
              }} />
            </div>
            Press "Simulate Drops" to see the D2 item-acquired animation
          </div>
        )}

        {drops.map((d, i) => (
          <DropNotification key={d.id} drop={d} index={i} />
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<LootDropDemo />);
</script>
</body>
</html>
